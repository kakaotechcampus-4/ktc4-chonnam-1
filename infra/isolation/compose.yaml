services:
  browser:
    image: ${ISOLATION_IMAGE:?Set the approved local image ID}
    platform: linux/amd64
    container_name: ktc-isolation-browser
    init: true
    # dockerd 가 부팅 때 방화벽보다 먼저 띄우지 않게, 시작과 재시작은 ktc-isolation-collector.service 가 맡는다.
    restart: "no"
    user: "10001:10001"
    # 수집 API를 위해 network_mode: none 대신 전용 브리지를 쓴다.
    # 기본값은 고정 IP:443. 공개 모드는 보호 IP 차단 뒤 공개 443 과 지정 DNS만 연다.
    networks: [collector]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    ports:
      - "8443:8443"
    # 기본값은 DNS 없이 egress-hosts 로 고정한다. 공개 모드는 지정한 IPv4 DNS만 사용한다.
    # extra_hosts 와 COLLECTOR_ALLOWED_HOSTS 는 render-egress.py 가 만든 compose.egress.yaml 이 채운다.
    # 그 파일 없이 띄우면 허용 호스트가 비어 수집기가 시작하지 않는다.
    dns: ["${COLLECTOR_DNS_SERVER:-127.0.0.1}"]
    # 프록시와 httpx 의 getaddrinfo 는 기본 스레드 풀에서 돌아 wait_for 로 끊기지 않는다.
    # 느린 네임서버가 스레드를 오래 붙잡지 못하게 한 번, 1초만 묻는다.
    dns_opt: ["timeout:1", "attempts:1"]
    environment:
      COLLECTOR_NETWORK_MODE: "${COLLECTOR_NETWORK_MODE:-allowlist}"
      COLLECTOR_PROTECTED_HOSTS: "${COLLECTOR_PROTECTED_HOSTS:-}"
      COLLECTOR_PROTECTED_IPS: "${COLLECTOR_PROTECTED_IPS:-}"
      COLLECTOR_MAX_CONCURRENCY: "1"
      # 2단계 httpx 2초 + 시간 초과 시 재시도 5초 + 3단계 브라우저 6초 + 정리 여유 3초 < 메인 서버 17초
      COLLECTOR_FETCH_TIMEOUT_SECONDS: "2"
      COLLECTOR_FETCH_RETRY_TIMEOUT_SECONDS: "5"
      COLLECTOR_BROWSER_TIMEOUT_SECONDS: "6"
      # off: httpx 만 / auto: JS 의존 신호가 있을 때만 / always: 가짜 페이지 시험용, 매번
      COLLECTOR_BROWSER: auto
      COLLECTOR_BROWSER_RESTART_EVERY: "50"
    # 토큰·인증서는 환경변수가 아니라 파일로 넣는다 (브라우저 env 로 새지 않게).
    secrets: [collect_token, collector_cert, collector_key]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    shm_size: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    # 인증 없는 요청에 401 이 오면 정상. 루프백 확인이라 인증서 검증은 끈다.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl, urllib.request, urllib.error\ntry:\n urllib.request.urlopen(urllib.request.Request('https://127.0.0.1:8443/collect', data=b'{}', method='POST'), timeout=4, context=ssl._create_unverified_context())\nexcept urllib.error.HTTPError as e:\n raise SystemExit(e.code != 401)\nraise SystemExit(1)"
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  collector:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: ktc-collector
    ipam:
      config:
        - subnet: 172.30.250.0/29

# make-secrets.sh 가 만든다. 소유 root:10001, 권한 440.
secrets:
  collect_token:
    file: ./secrets/collect_token
  collector_cert:
    file: ./secrets/collector.crt
  collector_key:
    file: ./secrets/collector.key
