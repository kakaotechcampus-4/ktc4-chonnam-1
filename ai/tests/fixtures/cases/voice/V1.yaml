id: V1
scenario: voice_phishing
input: {kind: audio}
transcript:
  - [A, "여보세요"]
  - [B, "금융감독원 수사관 김○○입니다. 고객님 명의 계좌가 범죄에 연루됐습니다"]
  - [A, "네? 어떻게 해야 하죠"]
  - [B, "자산 보호를 위해 안전계좌로 옮기셔야 합니다. 확인은 02-1234-5678로 하세요"]
runtime:
  search: kb_empty
  reading:
    other_speaker: B
    speaker_confidence: high
    identity: [{kind: institution, name: 금융감독원, quote: "금융감독원 수사관 김○○입니다"}]
    pretexts: [{quote: "고객님 명의 계좌가 범죄에 연루됐습니다"}]
    demands:
      - {kind: money_transfer, quote: "안전계좌로 옮기셔야 합니다"}
      - {kind: call_number, quote: "확인은 02-1234-5678로 하세요"}
expect:
  conclusion: suspected
  floors: [L-3]
  caution: false
  evidence_includes: [unofficial_number]
  stop_actions: [dont_send_money, dont_call_number_in_message, hang_up]
  questions: {already_acted: [entered_info, installed_app, sent_money, not_yet]}
  number_checks: [{number: "0212345678", org: 금융감독원, result: not_official}]
  unchecked_includes: ["similar_cases:kb_empty"]
  failures: []
  derived_by: llm
