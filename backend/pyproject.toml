[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pyyaml",
    "ai",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
ai = { path = "../ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
